name: Build Papyrus Follower mod

on:
  push:
    paths:
      - 'papyrus-follower/**'
      - '.github/workflows/papyrus-follower.yml'
  pull_request:
    paths:
      - 'papyrus-follower/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: papyrus-follower
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build mod jar
        run: ./gradlew --no-daemon build

      - uses: actions/upload-artifact@v4
        with:
          name: papyrus-follower-jar
          path: |
            papyrus-follower/build/libs/*.jar
            !papyrus-follower/build/libs/*-sources.jar
